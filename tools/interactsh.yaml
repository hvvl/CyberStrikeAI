name: "interactsh"
command: "python3"
args:
  - "-c"
  - |
    import sys, json, subprocess, os, time, signal, re

    action = sys.argv[1] if len(sys.argv) > 1 else "start"
    SESSION_FILE = os.path.join(os.environ.get("CYBERSTRIKE_WORKSPACE", "/tmp"), ".interactsh_session")

    def start(server=None):
        """Start interactsh-client with -sf session file. It runs as a short-lived
        process: generates domain + saves session (incl. keys) to SESSION_FILE,
        then we read the domain from stdout and kill it.
        Poll later reconnects with the same -sf to retrieve interactions."""
        try:
            cmd = ["interactsh-client", "-sf", SESSION_FILE, "-v"]
            if server:
                cmd += ["-server", server]
            proc = subprocess.Popen(
                cmd,
                stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                stdin=subprocess.PIPE, text=True
            )
            output_lines = []
            domain = None
            t0 = time.time()
            while time.time() - t0 < 20:
                line = proc.stdout.readline()
                if not line:
                    if proc.poll() is not None:
                        break
                    time.sleep(0.3)
                    continue
                output_lines.append(line.strip())
                # interactsh prints: [INF] c23b2xxxxx.oast.pro
                m = re.search(r'([a-z0-9]{10,}\.(oast\.(pro|live|site|online|fun|me)|[a-z0-9.-]+))', line)
                if m and 'INF' in line:
                    domain = m.group(1)
                    break

            # Kill — session is already saved to SESSION_FILE by -sf flag
            try:
                proc.send_signal(signal.SIGTERM)
                proc.wait(timeout=3)
            except Exception:
                proc.kill()

            if domain:
                return {
                    "status": "started",
                    "interaction_domain": domain,
                    "session_file": SESSION_FILE,
                    "instructions": "Use " + domain + " in payloads. Then call 'interactsh poll' to check callbacks.",
                    "raw_output": "\n".join(output_lines[:8])
                }
            else:
                return {
                    "status": "error",
                    "message": "Failed to get domain. Is interactsh-client installed? Is the server reachable?",
                    "raw_output": "\n".join(output_lines[:12])
                }
        except FileNotFoundError:
            return {"status": "error", "message": "interactsh-client not found. Install: go install -v github.com/projectdiscovery/interactsh/cmd/interactsh-client@latest"}
        except Exception as e:
            return {"status": "error", "message": str(e)}

    def poll(server=None):
        """Reconnect using the session file to check for interactions."""
        if not os.path.exists(SESSION_FILE):
            return {"status": "error", "message": "No session found. Call 'interactsh start' first."}
        try:
            cmd = ["interactsh-client", "-sf", SESSION_FILE, "-v", "-pi", "1"]
            if server:
                cmd += ["-server", server]
            proc = subprocess.Popen(
                cmd,
                stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                stdin=subprocess.PIPE, text=True
            )
            output_lines = []
            interactions = []
            t0 = time.time()
            while time.time() - t0 < 15:
                line = proc.stdout.readline()
                if not line:
                    if proc.poll() is not None:
                        break
                    time.sleep(0.3)
                    continue
                output_lines.append(line.strip())
                # Interaction lines contain protocol info: DNS/HTTP/SMTP/etc
                low = line.lower()
                if any(kw in low for kw in ["dns", "http", "smtp", "ldap", "interaction", "received from"]):
                    interactions.append(line.strip())
                # Also capture lines with the interaction domain
                if re.search(r'\d+\.\d+\.\d+\.\d+', line) and 'INF' not in line:
                    if line.strip() not in interactions:
                        interactions.append(line.strip())

            try:
                proc.send_signal(signal.SIGTERM)
                proc.wait(timeout=3)
            except Exception:
                proc.kill()

            return {
                "status": "polled",
                "has_callback": len(interactions) > 0,
                "interaction_count": len(interactions),
                "interactions": interactions[:20],
                "raw_output": "\n".join(output_lines[:30])
            }
        except Exception as e:
            return {"status": "error", "message": str(e)}

    server_arg = sys.argv[2] if len(sys.argv) > 2 else None

    if action == "start":
        result = start(server_arg)
    elif action == "poll":
        result = poll(server_arg)
    else:
        result = {"error": "Unknown action '" + action + "'. Use 'start' or 'poll'."}

    print(json.dumps(result, ensure_ascii=False, indent=2))
enabled: true
short_description: "OOB带外检测：启动interactsh获取唯一交互域名，用于blind XXE/SSRF/SQLi/RCE验证"
description: |
  Interactsh OOB（Out-of-Band）带外交互检测工具。

  ## 核心用途
  验证无回显的盲注型漏洞：
  - Blind XXE / Blind SSRF / Blind SQLi（DNS外带）/ Blind RCE / Blind 反序列化 / Blind 文件包含

  ## 工作原理
  使用 interactsh-client 的 **-sf (session-file)** 机制实现跨工具调用的 session 持久化：
  1. `start`: 启动 client → 获取唯一域名（如 c23b2xx.oast.pro）→ session（含密钥）自动保存到文件 → kill 进程
  2. 在 payload 中使用该域名
  3. `poll`: 用同一个 session file 重连 → client 自动解密并拉取所有交互记录 → 返回结果

  ## 使用流程
  ```
  # 步骤1: 启动监听
  interactsh start
  → {"status":"started", "interaction_domain":"c23b2xx.oast.pro", ...}

  # 步骤2: 构造payload并发送到目标
  curl "http://target/page?url=http://c23b2xx.oast.pro/test"

  # 步骤3: 等待5-10秒后检查回调
  interactsh poll
  → {"status":"polled", "has_callback":true, "interactions":["DNS query from 1.2.3.4", ...]}
  ```

  ## 依赖
  interactsh-client: `go install -v github.com/projectdiscovery/interactsh/cmd/interactsh-client@latest`

parameters:
  - name: "action"
    type: "string"
    description: |
      操作模式：
      - `start`: 启动 OOB 监听，获取唯一交互域名
      - `poll`: 检查是否有交互回调（自动复用 start 的 session）
    required: true
    position: 0
    format: "positional"
  - name: "server"
    type: "string"
    description: |
      OOB 服务器地址（可选）。
      默认自动选择。备选: oast.pro, oast.live, oast.site, oast.fun, oast.me
    required: false
    position: 1
    format: "positional"
